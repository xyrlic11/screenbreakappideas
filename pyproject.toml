[project]
name = "blink"
version = "0.1.0"
description = "A screen-time break reminder that makes skipping cost something"
requires-python = ">=3.10,<3.15"
dependencies = ["PySide6>=6.9,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
blink = "blink.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "blink", "blink.core", "blink.sensors", "blink.storage",
    "blink.ui", "blink.ui.pages", "blink.ui.activities",
]

[tool.setuptools.package-data]
blink = ["locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
